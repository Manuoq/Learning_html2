<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        h1{
            color: dark blue
        }
         @media screen and (min-width: 500px){
            h1{
                color: red
            }
        }
        @media screen and (min-width: 900px){
            h1{
                color: rgb(0, 255, 76)
            }
        }
        @media print{
            h1{
                background-color: rgb(233, 180, 6)
            }
        }
    </style>
</head>
<body>
    <nav><a href="../index.html">Volver atras</a></nav>
    <h1>Soy una Media Query</h1>
</body>
</html>
