<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floatation</title>
    <style>
        div {
            border: 1px solid black;
            height: 100px;
        }
        #d2, #d3, #d4 {
            float: left;
        }
        
        #d2 {
            width: 100px;
        }
        #d3 {
            width: 200px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">Volver atras</a>
    </nav>
    <div id="d1">Div 1</div>
    <div id="d2">Div 2</div>
    <div id="d3">Div 3</div>
    <div id="d4">Div 4</div>
    <div id="d5">Div 5</div>
</body>
</html>
