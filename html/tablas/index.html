<!DOCTYPE html> → 
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Indice HTML</title>
    </head>
    <body>
        <nav><a href="../enlaces/index.html">Volver a enlaces</a></nav>
        <h1> Ejemplos de tablas en HTML</h1>
        <table border="1">
            <tr>
                <th>Encabezado 1</th>
                <th>Encabezado 2</th>
                <th>Encabezado 3</th>
            </tr>
            <tr>
                <td>Celda 1</td>
                <td>Celda 2</td>
                <td>Celda 3</td>
            </tr>
            <tr>
                <td>Celda 4</td>
                <td>Celda 5</td>
                <td>Celda 6</td>
            </tr>
        </table>
        <h1> Ejemplo de tabla combinada
            <table border="1">
                <tr>
                    <th>Encabezado 1</th>
                    <th>Encabezado 2</th>
                    <th>Encabezado 3</th>
                </tr>
                <tr>
                    <td rowspan="2">Celda 1</td>
                    <td>Celda 2</td>
                    <td>Celda 3</td>
                </tr>
                <tr>
                    <td colspan="2">Celda combinada</td>
                </tr>
            </table>    
        </h1>
    </body>
</html>
