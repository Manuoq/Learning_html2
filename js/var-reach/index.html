<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcance variables</title>
    <script>
        var mensaje1 ="Hola Mundo desde var";
        let mensaje2 ="hola mundo desde let";

        function funcionVar(){
            var fnvar = "Estado 1 Var";
            if (true){
                var fnvar ="Estado 2 Var";
                console.log(fnVar)
            }
            console.log(fnVar);

        }
         function funcionlet(){
            let fnlet = "Estado 1 Let"
             if (true){
                var fnlet ="Estado 2 Let";
                console.log(fnLet)
            }
            console.log(fnLet);
        }
    </script>
</head>
<body>
    <script>
    funcionVar();
    funcionlet();
    </script>
    
</body>
</html>
