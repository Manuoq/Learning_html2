<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificacion del arbol DOM</title>
    <script>
        function addTask(){
            let input = document.getElementById("inputBox").value;
            console.log(input.value);
            let li = document.createElement("li")
            li.innerHTML = input.value
            document.getElementById("task").appendChild(li)
            input.value = "";

        }
        
        function deleteMe(e){
            console.log(e.parentNode);
            e.parentNode.remove();
        }
    </script>
</head>
<body>
    <nav><a href="../index.html">Volver a enlaces</a>
    <input name="task" type="text" id="inputBox">
    <button onclick="addTask()">Subir tarea</button>
    <ul id="task">

    </ul>
    <button id="deleteBtn" onclick="deleteMe(this)">Pulsa y desaparezco</button>
</body>
</html>
