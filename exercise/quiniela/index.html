<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela</title>
    <style>
        /* Aplicamos una fuente similar a la del boleto a todo el documento */
        body {
            font-family: Arial, sans-serif;
            margin: 20px; /* Un poco de margen para que no se pegue a los bordes */
        }

        /* Control estricto del tamaño de los logos */
        .logo-loterias img, .logo-quiniela img {
            width: 230px; /* Tamaño fijo ideal */
            max-width: 100%; /* Evita que desborde si la columna es muy estrecha */
            height: auto;
        }

        /* Alineación en 3 columnas */
        .logo-loterias {
            float: left;
            width: 20%;
            text-align: center; 
        }

        .info-central {
            float: left;
            width: 60%;
            text-align: center; 
        }

        .logo-quiniela {
            float: left;
            width: 20%;
            text-align: center; 
        }

        /* Limpieza de flotados */
        .limpiar-flotados {
            clear: both;
        }

        /* Estilos de la barra azul oscura */
        .barra-azul-oscura {
            background-color: #4A86E8; 
            color: white; 
            padding: 5px 0;
        }
        
        .barra-azul-oscura h2 {
            margin: 0; 
            font-size: 26px; /* Letra un poco más grande */
        }

        /* Estilos de las instrucciones */
        .instrucciones {
            font-size: 13px; /* Aumentado para mejor lectura */
            text-align: left; 
            margin: 10px 0; 
        }

        .instrucciones p {
            margin: 2px 0; 
        }

        /* Estilos de la barra azul clara */
        .barra-azul-clara {
            background-color: #E6F2FF; 
            color: #2986CC; 
            border: 2px solid #2986CC; 
            padding: 5px;
            font-size: 14px;
        }

        .barra-azul-clara p {
            margin: 0;
            font-weight: bold; 
        }

        /* Utilidad para separar los textos del interior */
        .flotar-izq {
            float: left;
        }
        .flotar-der {
            float: right;
        }
    </style>
</head>
<body>
    <div id="cabecera-quiniela">

        <div class="logo-loterias">
            <img src="../assets/Logo_de_Loterías_y_Apuestas_del_Estado.jpg" alt="Loterías y Apuestas del Estado">
        </div>

        <div class="info-central">
            <div class="barra-azul-oscura">
                <h2>SENCILLO-MÚLTIPLE 261</h2>
            </div>
            
            <div class="instrucciones">
                <p><strong>SENCILLAS:</strong> Marque 14 signos por bloque (mínimo 2) en la zona de PRONÓSTICOS.</p>
                <p><strong>MÚLTIPLES:</strong> Marque los pronósticos sólo en bloque 1 y el número de Dobles y Triples en la zona de COMBINACIONES.</p>
            </div>
            
            <div class="barra-azul-clara">
                <p>
                    <span class="flotar-izq">1.ª Liga BBVA / 2.ª Liga Adelante</span>
                    <span>JORNADA: 1.ª</span>
                    <span class="flotar-der">FECHA: 23-8-15</span>
                </p>
                <div class="limpiar-flotados"></div>
            </div>
        </div>

        <div class="logo-quiniela">
            <img src="../assets/La_Quiniela.jpg" alt="La Quiniela">
        </div>

        <div class="limpiar-flotados"></div>

    </div>
</body>
</html>
